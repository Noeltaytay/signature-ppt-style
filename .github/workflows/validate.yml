name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Check templates
        run: python scripts/check_style.py templates
      - name: Recolor templates with a non-default palette
        run: |
          python scripts/apply_palette.py \
            --palette presets/academic-warm.json \
            --src templates \
            --out /tmp/templates-academic
          python scripts/check_style.py /tmp/templates-academic \
            --palette presets/academic-warm.json
