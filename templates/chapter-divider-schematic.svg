    <rect x="96" y="306" width="604" height="224" fill="#C2A368"/>
    <rect x="84" y="294" width="604" height="224" fill="#F7FAFE" stroke="#C2A368" stroke-width="1.5"/>
    <text x="132" y="420" font-family="Georgia, Source Han Serif SC Heavy, SimSun" font-size="96" fill="#192F59" letter-spacing="2">{{CHAPTER_TITLE}}</text>
    <text x="134" y="470" font-family="Georgia, Source Han Serif SC Heavy, SimSun" font-size="24" fill="#5B7080" letter-spacing="6">{{CHAPTER_EN}}</text>
