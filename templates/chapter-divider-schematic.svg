      <circle cx="830" cy="330" r="1.8"/><circle cx="1198" cy="470" r="1.6"/>
    </g>
  </g>

  <rect id="chapter-bottom" data-pptx-role="decoration" x="0" y="520" width="760" height="200" fill="url(#chapterBottom)"/>

  <g id="chapter-plate" data-pptx-bounds="84 250 610 280">
