  <g id="chapter-pagenum" data-pptx-bounds="1160 680 56 24">
    <text x="1216" y="700" font-size="12" fill="#B9CAD7" text-anchor="end" letter-spacing="1">{{PAGE_NO}} / {{TOTAL_PAGES}}</text>
