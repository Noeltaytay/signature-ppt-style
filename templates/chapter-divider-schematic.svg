<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Microsoft YaHei, Arial" data-pptx-page-role="section">
  <defs>
    <linearGradient id="chapterField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2240"/>
      <stop offset="55%" stop-color="#1B3E6B"/>
      <stop offset="100%" stop-color="#192F59"/>
    </linearGradient>
    <radialGradient id="chapterGlow" cx="0.22" cy="0.55" r="0.8">
      <stop offset="0%" stop-color="#2E6AA8" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#163A60" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#192F59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelField" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1C4069"/>
      <stop offset="58%" stop-color="#142C4D"/>
      <stop offset="100%" stop-color="#10233F"/>
    </linearGradient>
    <linearGradient id="chapterBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B35" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1B35" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect id="chapter-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#chapterField)"/>
  <rect id="chapter-glow" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#chapterGlow)"/>

  <g id="chapter-number" data-pptx-role="decoration" data-pptx-bounds="60 140 640 560">
    <text x="80" y="540" font-family="Georgia, Source Han Serif SC Heavy, SimSun" font-size="420" fill="#4A7FB0" fill-opacity="0.12" letter-spacing="6">01</text>
  </g>

  <g id="chapter-panel-group" data-pptx-role="decoration" data-pptx-bounds="720 0 560 720">
    <polygon id="chapter-panel" points="790,0 1280,0 1280,720 730,720 756,650 726,578 760,506 730,430 768,354 738,272 774,194 748,108" fill="url(#panelField)"/>
    <polyline points="790,0 748,108 774,194 738,272 768,354 730,430 760,506 726,578 756,650 730,720" fill="none" stroke="#5B8FBF" stroke-width="2.5" stroke-opacity="0.34"/>
  </g>

