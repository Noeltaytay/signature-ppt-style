<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <defs>
    <linearGradient id="closingField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10254A"/>
      <stop offset="55%" stop-color="#1B3E6B"/>
      <stop offset="100%" stop-color="#192F59"/>
    </linearGradient>
    <radialGradient id="closingGlow" cx="0.78" cy="0.46" r="0.7">
      <stop offset="0%" stop-color="#2E6AA8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#163A60" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#192F59" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="closing-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#closingField)"/>
  <rect id="closing-glow" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#closingGlow)"/>

  <g id="closing-visual" data-pptx-role="decoration" data-pptx-bounds="780 100 500 560">
    <circle cx="1030" cy="370" r="200" fill="#2E6AA8" fill-opacity="0.10"/>
    <circle cx="1030" cy="370" r="190" fill="none" stroke="#5B8FBF" stroke-width="1" stroke-opacity="0.20"/>
    <circle cx="1030" cy="370" r="144" fill="none" stroke="#5B8FBF" stroke-width="1" stroke-opacity="0.13" stroke-dasharray="2,8"/>
    <line x1="1030" y1="370" x2="850" y2="220" stroke="#5B8FBF" stroke-width="1" stroke-opacity="0.18"/>
    <line x1="1030" y1="370" x2="1210" y2="250" stroke="#5B8FBF" stroke-width="1" stroke-opacity="0.16"/>
    <rect x="850" y="240" width="360" height="270" fill="#10233F" stroke="#C2A368" stroke-width="1.5" stroke-dasharray="8 8"/>
    <text x="1030" y="382" font-size="16" fill="#C9D7E0" text-anchor="middle">IMAGE PLACEHOLDER</text>
    <g fill="#C2A368" fill-opacity="0.65">
      <circle cx="880" cy="180" r="2.4"/><circle cx="1188" cy="300" r="2.0"/><circle cx="1160" cy="560" r="2.2"/>
    </g>
  </g>

  <g id="closing-kicker" data-pptx-bounds="80 60 700 40">
    <line x1="80" y1="80" x2="120" y2="80" stroke="#C2A368" stroke-width="2"/>
    <text x="134" y="86" font-size="16" fill="#D8BE86" letter-spacing="1.5">{{EVENT}}</text>
  </g>

  <g id="closing-title" data-pptx-bounds="80 200 680 232">
    <text x="80" y="286" font-family="Georgia, Source Han Serif SC Heavy, SimSun" font-size="96" fill="#F5F8FA">{{CLOSING_LINE_1}}</text>
    <text x="80" y="398" font-family="Georgia, Source Han Serif SC Heavy, SimSun" font-size="96" fill="#C2A368">{{CLOSING_LINE_2}}</text>
  </g>

  <g id="closing-identity" data-pptx-bounds="80 432 700 220">
    <text x="82" y="462" font-size="26" fill="#C9D7E0">{{CLOSING_SUBTITLE}}</text>
    <line x1="82" y1="488" x2="202" y2="488" stroke="#C2A368" stroke-width="2"/>
    <text x="82" y="546" font-family="Georgia, Source Han Serif SC Heavy, SimSun" font-size="40" fill="#F5F8FA">{{NAME}}</text>
    <text x="82" y="582" font-size="22" fill="#E7CB92">{{ROLE}}</text>
    <text x="82" y="630" font-size="22" fill="#B9CAD7">{{THANKS}}</text>
  </g>

  <g id="closing-footer" data-pptx-bounds="1160 676 56 36">
    <text x="1216" y="704" font-size="12" fill="#B9CAD7" text-anchor="end" letter-spacing="1">{{PAGE_NO}} / {{TOTAL_PAGES}}</text>
  </g>
</svg>
